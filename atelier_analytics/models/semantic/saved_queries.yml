version: 2

# The executive scorecard is defined here once, as a saved query. The BI export reads it with
# `mf query --saved-query executive_scorecard`, which is the same path a dashboard connector uses.
saved_queries:
  - name: executive_scorecard
    label: Executive scorecard by fiscal year
    description: Headline commercial metrics by fiscal year, as shown on the leadership dashboard.
    query_params:
      metrics:
        - net_sales
        - units_sold
        - gross_margin_pct
        - average_selling_price
        - comp_store_sales_growth
        - comp_sales_growth
        - average_days_to_sell
      group_by:
        - TimeDimension('metric_time', 'fiscal_year')
      order_by:
        - TimeDimension('metric_time', 'fiscal_year')

  - name: inventory_health
    label: Inventory health by fiscal year and stock pool
    description: Sell-through, stock on hand and aged stock for each stock pool by fiscal year.
    query_params:
      metrics:
        - sell_through_rate
        - units_on_hand
        - aged_inventory_share
        - inventory_cost_on_hand
      group_by:
        - TimeDimension('metric_time', 'fiscal_year')
        - Dimension('stock_pool__stock_pool_name')

  - name: sales_trend
    label: Monthly sales by channel
    description: Net sales, units and margin by month for boutiques and online, for the dashboard trend chart.
    query_params:
      metrics:
        - net_sales
        - units_sold
        - gross_margin_pct
      group_by:
        - TimeDimension('metric_time', 'month')
        - Dimension('location__channel')
      order_by:
        - TimeDimension('metric_time', 'month')

  - name: category_mix
    label: Sales mix by fiscal year and model category
    description: Net sales, units, margin and days to sell for each model category by fiscal year.
    query_params:
      metrics:
        - net_sales
        - units_sold
        - gross_margin_pct
        - average_days_to_sell
      group_by:
        - TimeDimension('metric_time', 'fiscal_year')
        - Dimension('piece__model_category')

  - name: margin_by_location
    label: Gross margin by fiscal year and location
    description: Gross margin %, net sales and units for each selling location (the three boutiques and online) by fiscal year.
    query_params:
      metrics:
        - gross_margin_pct
        - net_sales
        - units_sold
      group_by:
        - TimeDimension('metric_time', 'fiscal_year')
        - Dimension('location__location_name')
      order_by:
        - TimeDimension('metric_time', 'fiscal_year')
